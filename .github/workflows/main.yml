name: Check Syntax and Code Quality

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Fast syntax and fatal error check using flake8
      - name: Lint for Python syntax errors and undefined names
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      # Comprehensive linting using Ruff
      - name: Check formatting and lint rules with Ruff
        run: |
          ruff check .
